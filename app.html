<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'self'">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Gestor Gym</title>
<link rel="icon" href="img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/estilos.css?v=6">
</head>
<body class="pagina-app cargando">
<div id="sin-conexion" class="franja-sin-conexion" role="status" hidden>Sin conexión a internet. No se puede operar hasta que vuelva.</div>

<div class="armazon">
  <aside class="lateral" aria-label="Menú principal">
    <div class="marca-lateral">
      <img data-logo class="logo" alt="" hidden>
      <strong data-nombre-gym>Gestor Gym</strong>
    </div>
    <nav id="menu-lateral" class="menu"></nav>
    <div class="usuario">
      <div><div id="usuario-nombre" class="usuario-nombre"></div><div id="usuario-rol" class="suave"></div><div class="suave version" data-version></div></div>
      <button type="button" class="boton secundario chico" data-salir>Salir</button>
    </div>
  </aside>

  <div class="columna">
    <header class="barra">
      <h1 id="titulo-seccion">Inicio</h1>
      <button type="button" class="boton secundario chico solo-telefono" data-salir>Salir</button>
    </header>
    <main id="contenido" class="contenido" tabindex="-1"></main>
  </div>
</div>

<div id="panel-mas" class="panel-mas" hidden></div>
<nav id="menu-inferior" class="inferior" aria-label="Menú principal"></nav>

<script src="js/vendor/supabase.js"></script>
<script type="module" src="js/app.js?v=6"></script>
</body>
</html>
